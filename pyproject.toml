[project]
name = "traffic-surveillance"
version = "0.1.0"
description = "Computer vision and data processing project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib==3.11.2",
    "networkx==3.6.1",
    "numpy==2.2.6",
    "nvidia-ml-py==13.610.43",
    "opencv-python==4.12.0.88",
    "pillow==12.3.0",
    "polars==1.44.2",
    "psutil==7.2.2",
    "psycopg[binary]==3.3.6",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "ultralytics==8.4.90",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
