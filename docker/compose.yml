services:
  postgres:
    image: postgres:16
    container_name: traffic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_db
      POSTGRES_USER: traffic_app
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - traffic_postgres_data:/var/lib/postgresql/data

volumes:
  traffic_postgres_data: